<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة مؤشرات المطعم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-[#0b0f19] text-white p-8">

  <div class="max-w-5xl mx-auto">
    <div class="mb-8 pb-4 border-b border-gray-800 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-amber-500">لوحة تحكم المطعم 🍕</h1>
        <p class="text-sm text-gray-400">متابعة الأداء والمبيعات اللحظية</p>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/20">متصل بالنظام</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-[#131b2e] p-6 rounded-2xl border border-white/5 shadow-xl">
        <p class="text-gray-400 text-sm mb-2">إجمالي مبيعات الطلبات</p>
        <h2 class="text-4xl font-extrabold text-emerald-400" id="totalSales">جاري التحميل...</h2>
      </div>

      <div class="bg-[#131b2e] p-6 rounded-2xl border border-white/5 shadow-xl">
        <p class="text-gray-400 text-sm mb-2">إجمالي عدد الطلبات</p>
        <h2 class="text-4xl font-extrabold text-sky-400" id="totalOrders">جاري التحميل...</h2>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const locationId = urlParams.get('location_id');

    if (locationId) {
      fetch(`/api/stats?locationId=${locationId}`)
        .then(res => res.json())
        .then(data => {
          if(data.success) {
            document.getElementById('totalSales').innerText = data.totalSales.toLocaleString() + ' ج.م';
            document.getElementById('totalOrders').innerText = data.totalOrders + ' طلب';
          } else {
            document.getElementById('totalSales').innerText = 'خطأ في جلب البيانات';
          }
        })
        .catch(err => console.error(err));
    } else {
      document.getElementById('totalSales').innerText = 'معرف المطعم غير متاح';
    }
  </script>
</body>
</html>
